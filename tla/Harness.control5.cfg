\* Control 5 (spec 006, C6): una caída con max_resumes agotado deja la ejecución en interrupted en vez de Fallar.
\* espera: TerminaSiempre
SPECIFICATION Spec
CONSTANTS
  NumCapitulos = 5
  MaxRetriesPlan = 2
  MaxRetriesChapter = 2
  MaxRetriesGate = 2
  MaxResumes = 2
  Defecto = 5
PROPERTY TerminaSiempre
\* Un estado final sin salida no es un error; uno no final lo detecta TerminaSiempre.
CHECK_DEADLOCK FALSE
